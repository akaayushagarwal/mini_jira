spring:
    application:
        name: mini_jira

    datasource:
        url: ${AIVEN_URL}
        username: ${AIVEN_USERNAME}
        password: ${AIVEN_PASSWORD}
    jpa:
        hibernate:
            ddl-auto: update

        show-sql: true
        open-in-view: true

management:
    endpoints:
        web:
            exposure:
                include: health, metrics, info
    endpoint:
        health:
            show-details: always

logging:
    level:
        root: INFO
        '[com.example.mini_jira]': DEBUG
        '[org.hibernate.sql]': DEBUG
    file: 
        name: mini-jira-logs.log
