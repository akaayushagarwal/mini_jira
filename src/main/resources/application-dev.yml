spring:
    application:
        name: mini_jira

    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
    jpa:
        hibernate:
            ddl-auto: none

        show-sql: false
        open-in-view: false

    threads:
        virtual:
            enabled: true
    data:
        redis:
            host: ${REDIS_HOST}
            port: ${REDIS_PORT}
            password: ${REDIS_PASSWORD} 
            ssl:
                enabled: true 

    rabbitmq:
        addresses: ${RABBITMQ_URL}
    #    host: localhost
    #    port: 5672
    #    username: guest
    #    password: guest 
    mail:
        host: smtp.gmail.com
        port: 587
        username: ${MAIL_USERNAME}
        password: ${MAIL_PASSWORD}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true

management:
    endpoints:
        web:
            exposure:
                include: health, metrics, info
    endpoint:
        health:
            show-details: always

logging:
    level:
        root: INFO
        '[com.example.mini_jira]': DEBUG
        '[org.hibernate.sql]': DEBUG
    file: 
        name: mini-jira-logs.log
